<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a3d36"><title>TradeDesk | مدیریت بازرگانی</title><link rel="stylesheet" href="/assets/app.css"></head><body>
<div id="toast" class="toast"></div><section id="login" class="login"><div class="login-art"><div class="brandmark">T</div><h1>تجارت، با حافظه‌ای دقیق</h1><p>کالاها، طرف‌های تجاری، فرصت‌ها و اسناد؛ همه در یک فضای عملیاتی امن.</p><div class="login-stats"><span>امن و نقش‌محور</span><span>داده‌محور</span><span>فارسی و راست‌چین</span></div></div><form id="loginForm" class="login-card"><div class="eyebrow">TRADE OPERATIONS</div><h2>ورود به TradeDesk</h2><p>برای ادامه اطلاعات حساب سازمانی خود را وارد کنید.</p><label>نام کاربری یا ایمیل<input name="login" autocomplete="username" required value="admin"></label><label>رمز عبور<input name="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">ورود به سامانه <span>←</span></button><div id="loginError" class="form-error"></div></form></section>
